name: Shared Git desktop views
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native accessibility prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev cmake ninja-build xvfb
      - run: python3 tool/checkout_shared_dependencies.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Native GTK accessibility
        run: |
          cmake -S linux/native -B build/native -G Ninja
          cmake --build build/native
          xvfb-run -a ctest --test-dir build/native --output-on-failure
