name: busystack_git_flutter
description: Shared desktop Git review and workflow views for BusyStack.
version: 0.1.0
publish_to: none
repository: https://github.com/busystack/busystack_git_flutter
environment:
  sdk: '>=3.12.1 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  busystack_git:
    path: ../busystack_git
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  plugin:
    platforms:
      linux:
        pluginClass: BusystackGitFlutterPlugin
